<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>auth</title></head>
<body>
<script>
  const q = new URLSearchParams(location.search);
  if (window.opener) {
    window.opener.postMessage({ code: q.get('code'), state: q.get('state') }, location.origin);
  }
  document.body.textContent = 'Authentication complete — you can close this tab.';
</script>
</body>
</html>
